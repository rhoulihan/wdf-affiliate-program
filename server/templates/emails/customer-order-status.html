<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[EMAIL_TITLE]</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #1e3a8a; color: #ffffff !important; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .logo { max-width: 180px; margin-bottom: 12px; }
        .content { background-color: #f9f9f9; padding: 20px; border: 1px solid #ddd; }
        .status-update { background-color: #e3f2fd; padding: 15px; margin: 15px 0; border-radius: 5px; border: 1px solid #2196f3; }
        .footer { background-color: #f5f5f5; padding: 20px; text-align: center; font-size: 12px; color: #6b7280; }
        .button { display: inline-block; padding: 12px 30px; background-color: #ffffff !important; color: #ffffff !important; text-decoration: none !important; border-radius: 5px; margin: 15px 0; }
        .detail-row { margin: 10px 0; }
        .detail-label { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="[BRAND_LOGO]" alt="[BRAND_NAME]" class="logo">
            <h1>[EMAIL_HEADER]</h1>
        </div>
        <div class="content">
            <p>[GREETING]</p>
            
            <p>[UPDATE_MESSAGE]</p>
            
            <div class="status-update">
                <h2 style="color: #1976d2; margin-bottom: 15px;">[STATUS_UPDATE_TITLE]</h2>
                <div class="detail-row">
                    <span class="detail-label">[ORDER_ID_LABEL]:</span> [ORDER_ID]
                </div>
                <div class="detail-row" style="font-size: 18px; color: #1976d2;">
                    <span class="detail-label">[STATUS_LABEL]:</span> [STATUS_MESSAGE]
                </div>
                [WEIGHT_INFO]
                [TOTAL_INFO]
            </div>

            [EXTRA_BLOCK]

            <p>[THANK_YOU_MESSAGE]</p>
            
            <p>[CLOSING_MESSAGE]</p>
        </div>
        <div class="footer">
            <p>&copy; [CURRENT_YEAR] [BRAND_LEGAL]. [FOOTER_RIGHTS]</p>
            <p>[FOOTER_AUTOMATED_MESSAGE]</p>
        </div>
    </div>
</body>
</html>
